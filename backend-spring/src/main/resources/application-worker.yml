spring:
  main:
    web-application-type: none

app:
  sync:
    enabled: ${ANIME_SYNC_ENABLED:true}
  environment: ${NODE_ENV:production}
  redis-enabled: ${REDIS_ENABLED:true}
  localization:
    retry-enabled: ${LOCALIZATION_RETRY_ENABLED:true}
    retry-delay-ms: ${LOCALIZATION_RETRY_DELAY_MS:30000}
